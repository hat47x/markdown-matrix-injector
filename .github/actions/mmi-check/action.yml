name: MMI check
description: Run read-only MMI reference checks and write a provenance summary to the job.
author: hat47x

inputs:
  root:
    description: Workspace root passed to every MMI command.
    required: false
    default: .
  paths:
    description: Comma-separated Markdown files or directories to check.
    required: false
    default: .
  ledger:
    description: Import ledger path, relative to the workspace root.
    required: false
    default: mmi-ledger.json
  review-basis:
    description: Review-basis sidecar path, relative to the workspace root.
    required: false
    default: mmi-review-basis.json
  fail-on:
    description: Comma-separated conditions that fail the job (diagnostics, stale, review-stale, missing).
    required: false
    default: diagnostics,review-stale,missing
  mmi:
    description: MMI executable available on PATH (for example mmi or npx).
    required: false
    default: mmi
  expect-commit:
    description: Expected MMI build commit (40 hex digits). A different build stops the job before any check runs. Empty means not pinned.
    required: false
    default: ''
  expect-lock-digest:
    description: Expected package-lock.json digest of the MMI build (sha256:<64 hex digits>). Empty means not pinned.
    required: false
    default: ''
  expect-node-major:
    description: Expected Node.js major version that runs MMI (for example 22). Empty means not pinned.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run MMI check and provenance report
      shell: bash
      env:
        MMI_ROOT: ${{ inputs.root }}
        MMI_PATHS: ${{ inputs.paths }}
        MMI_LEDGER: ${{ inputs.ledger }}
        MMI_REVIEW_BASIS: ${{ inputs.review-basis }}
        MMI_FAIL_ON: ${{ inputs.fail-on }}
        MMI_COMMAND: ${{ inputs.mmi }}
        MMI_EXPECT_COMMIT: ${{ inputs.expect-commit }}
        MMI_EXPECT_LOCK_DIGEST: ${{ inputs.expect-lock-digest }}
        MMI_EXPECT_NODE_MAJOR: ${{ inputs.expect-node-major }}
      run: |
        set -euo pipefail
        args=(--mmi "$MMI_COMMAND" --root "$MMI_ROOT" --ledger "$MMI_LEDGER" --review-basis "$MMI_REVIEW_BASIS" --fail-on "$MMI_FAIL_ON")
        if [ -n "$MMI_EXPECT_COMMIT" ]; then args+=(--expect-commit "$MMI_EXPECT_COMMIT"); fi
        if [ -n "$MMI_EXPECT_LOCK_DIGEST" ]; then args+=(--expect-lock-digest "$MMI_EXPECT_LOCK_DIGEST"); fi
        if [ -n "$MMI_EXPECT_NODE_MAJOR" ]; then args+=(--expect-node-major "$MMI_EXPECT_NODE_MAJOR"); fi
        IFS=',' read -r -a paths <<< "$MMI_PATHS"
        for item in "${paths[@]}"; do
          args+=(--paths "$item")
        done
        node "$GITHUB_ACTION_PATH/../../../03_Implement/scripts/ci/mmi-ci.mjs" "${args[@]}"

branding:
  icon: check-circle
  color: blue
