name: CI

# 2026-09-23: GitHub Actions monthly usage was exhausted, so every job is gated
# on the repository variable MMI_ACTIONS_ENABLED (ADR-0025 D4). With the
# variable unset the jobs are skipped and use no minutes; set it to 'true'
# (Settings > Secrets and variables > Actions > Variables) to resume CI
# without editing this file. The jobs call the same commands as a local run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Product tests on Linux and on Windows, where most writers run VS Code.
  test:
    if: ${{ vars.MMI_ACTIONS_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: 03_Implement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03_Implement/package-lock.json
      - name: Check planning document placement
        run: npm run check:plans
      - name: Install dependencies
        run: npm ci
      - name: Type check and build (whole project)
        run: npm run build
      - name: Product tests
        run: npm test
      - name: Release-gate tool tests
        run: npm run test:release-gate-tools
      # Verify the actual npm tarball, not only the checkout's TypeScript code.
      # package:cli creates SHA256 evidence, installs the tarball with an empty
      # npm cache and --offline, and smokes both mmi and mmi-mcp. Run once per
      # PR on Linux to limit CI minutes; main's release-candidate job has its
      # own packaging gate. Windows runs the same acceptance on pushes to main
      # and manual runs (#694), not on every PR.
      - name: Offline standalone CLI and MCP package acceptance (Linux PR)
        if: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' }}
        run: npm run package:cli
      - name: Offline standalone CLI and MCP package acceptance (Windows, main and manual)
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' }}
        run: npm run package:cli

  # Research-layer tests (#519). Informational: known failures there must not hide product regressions.
  research-tests:
    if: ${{ vars.MMI_ACTIONS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: 03_Implement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03_Implement/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Research-lane unit tests
        run: npm run test:research

  # One release candidate per commit on main: VSIX, CLI tarball and the
  # evidence that binds them to this commit (ADR-0025 D1). Nothing is published.
  release-candidate:
    if: ${{ vars.MMI_ACTIONS_ENABLED == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: 03_Implement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03_Implement/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build release candidate
        run: npm run release:candidate
      - name: Upload release candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: artifacts/release/
          if-no-files-found: error
