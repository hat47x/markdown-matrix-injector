name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_Implement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03_Implement/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmi-dist
          path: 03_Implement/dist

  release-gate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03_Implement/package-lock.json
      - name: Install dependencies
        working-directory: 03_Implement
        run: npm ci
      - name: Run release-gate tool unit tests
        working-directory: 03_Implement
        run: npm run test:release-gate-tools
      - name: Run release gate check
        working-directory: 03_Implement
        run: npm run release:gate:full
      - name: Upload release gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: |
            artifacts/release-gate.json
            artifacts/release-gate.md
            artifacts/release-gate-metrics.csv
            artifacts/phase7-issue-rollup.md
