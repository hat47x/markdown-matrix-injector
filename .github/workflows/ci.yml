name: CI

# 2026-09-23: GitHub Actions monthly usage is exhausted.
# Keep this workflow manual-only and all jobs disabled until Actions use is explicitly resumed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_Implement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03_Implement/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmi-dist
          path: 03_Implement/dist

  # Research-layer tests (#519). Informational: known failures there must not hide product regressions.
  research-tests:
    if: ${{ false }}
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: 03_Implement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03_Implement/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Research-lane unit tests
        run: npm run test:research

  release-gate:
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03_Implement/package-lock.json
      - name: Install dependencies
        working-directory: 03_Implement
        run: npm ci
      - name: Run release-gate tool unit tests
        working-directory: 03_Implement
        run: npm run test:release-gate-tools
      - name: Run release gate check
        working-directory: 03_Implement
        run: |
          npm run release:gate:clean
          python3 ../01_Plans/tools/release_gate_check.py \
            --repo-root .. \
            --format json \
            --output-file artifacts/release-gate.json \
            --output-markdown-file artifacts/release-gate.md \
            --allow-pending-issues
          python3 ../01_Plans/tools/release_gate_metrics.py \
            --input-file ../artifacts/release-gate.json \
            --output-file ../artifacts/release-gate-metrics.csv
          npm run docs:phase7-rollup
          npm run release:gate:assert
      - name: Upload release gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: |
            artifacts/release-gate.json
            artifacts/release-gate.md
            artifacts/release-gate-metrics.csv
            artifacts/phase7-issue-rollup.md

  package:
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: release-gate
    defaults:
      run:
        working-directory: 03_Implement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03_Implement/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Package VSIX
        run: npx vsce package
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmi-vsix
          path: 03_Implement/*.vsix
          if-no-files-found: error
