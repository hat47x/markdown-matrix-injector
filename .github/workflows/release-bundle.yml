name: Release Candidate

# Builds a release candidate on demand, including the Extension Host E2E
# (ADR-0025 D1). It uploads the candidate as a workflow artifact and publishes
# nothing: creating a tag, a GitHub Release or a Marketplace entry stays a
# human step (ADR-0025 D3). Gated on MMI_ACTIONS_ENABLED like CI (D4).
on:
  workflow_dispatch:
    inputs:
      vscode-version:
        description: 'VS Code for the E2E: "stable", or x.y.z (e.g. the engines.vscode floor 1.100.0, ADR-0025 D2)'
        required: true
        default: 'stable'
        type: string

permissions:
  contents: read

jobs:
  candidate:
    if: ${{ vars.MMI_ACTIONS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_Implement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03_Implement/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Extension Host E2E prerequisites
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build release candidate with Extension Host E2E
        env:
          VSCODE_PIN: ${{ inputs.vscode-version }}
        run: |
          set -euo pipefail
          if [ "$VSCODE_PIN" = "stable" ]; then
            npm run release:candidate -- --e2e
          elif [[ "$VSCODE_PIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            npm run release:candidate -- --e2e --vscode-version "$VSCODE_PIN"
          else
            echo "vscode-version must be 'stable' or x.y.z, got: $VSCODE_PIN" >&2
            exit 2
          fi
      - name: Upload release candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}-vscode-${{ inputs.vscode-version }}
          path: artifacts/release/
          if-no-files-found: error
